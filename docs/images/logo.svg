<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Berlin HD map sample</title>
  <desc id="logoDesc">Stylized road lanes and project title for Str. des 17. Juni OpenDRIVE sample</desc>
  <defs>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
  </defs>
  <!-- Road / lane mark -->
  <rect x="8" y="16" width="56" height="56" rx="12" fill="url(#road)"/>
  <rect x="22" y="24" width="4" height="40" rx="2" fill="#e2e8f0" opacity="0.95"/>
  <rect x="34" y="24" width="4" height="40" rx="2" fill="#e2e8f0" opacity="0.95"/>
  <rect x="46" y="24" width="4" height="40" rx="2" fill="#e2e8f0" opacity="0.95"/>
  <circle cx="72" cy="20" r="8" fill="#c53030" stroke="#fff" stroke-width="2"/>
  <!-- Wordmark -->
  <text x="84" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1a202c">Berlin HD map</text>
  <text x="84" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#4a5568">Str. des 17. Juni · OpenDRIVE sample</text>
</svg>
